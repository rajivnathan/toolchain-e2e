apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: perfapp
  namespace: onboarding-perfapp
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perfapp
  namespace: onboarding-perfapp
subjects:
  - kind: ServiceAccount
    name: perfapp
    namespace: onboarding-perfapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perfapp
